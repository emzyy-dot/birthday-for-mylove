<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0d0b0c;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        .small-text {
            font-size: 12px;
            letter-spacing: 4px;
            color: #999;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 34px;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .code-display {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 35px;
        }

        .dot {
            width: 13px;
            height: 13px;
            border: 1px solid #777;
            border-radius: 50%;
            transition: 0.2s;
        }

        .dot.filled {
            background: #ffffff;
            border-color: #ffffff;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            justify-content: center;
            gap: 14px;
        }

        button {
            width: 70px;
            height: 60px;
            border: 1px solid #333;
            background: #151314;
            color: white;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #252223;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .message {
            height: 20px;
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }

        .success {
            position: fixed;
            inset: 0;
            background: #0d0b0c;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .success.show {
            opacity: 1;
            pointer-events: auto;
        }

        .success h2 {
            font-size: 40px;
            font-weight: 300;
            margin-bottom: 15px;
        }

        .success p {
            color: #aaa;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="small-text">
            Private Access
        </div>

        <h1>Something is waiting for you.</h1>

        <p class="subtitle">
            Enter the code to continue.
        </p>

        <div class="code-display">
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
            <div class="dot" id="dot4"></div>
        </div>

        <div class="keypad">
            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>

            <button onclick="clearCode()">×</button>
            <button onclick="addNumber('0')">0</button>
            <button onclick="checkCode()">✓</button>
        </div>

        <div class="message" id="message"></div>

    </div>


    <div class="success" id="success">

        <div>
            <h2>Access Granted.</h2>
            <p>Okay... you made it. ❤️</p>
        </div>

    </div>


    <script>

        let enteredCode = "";

        // CHANGE YOUR PASSWORD HERE
        const correctCode = "1234";


        function addNumber(number) {

            if (enteredCode.length >= 4) {
                return;
            }

            enteredCode += number;

            updateDots();

            if (enteredCode.length === 4) {
                setTimeout(checkCode, 300);
            }
        }


        function updateDots() {

            for (let i = 1; i <= 4; i++) {

                const dot = document.getElementById("dot" + i);

                if (i <= enteredCode.length) {
                    dot.classList.add("filled");
                } else {
                    dot.classList.remove("filled");
                }

            }
        }


        function clearCode() {

            enteredCode = "";

            updateDots();

            document.getElementById("message").textContent = "";
        }


        function checkCode() {

            if (enteredCode.length !== 4) {
                return;
            }

            if (enteredCode === correctCode) {

                document
                    .getElementById("success")
                    .classList.add("show");

            } else {

                document.getElementById("message").textContent =
                    "Hmm... that's not it.";

                enteredCode = "";

                updateDots();

            }
        }

    </script>

</body>
</html>
